apiVersion: v1
kind: Pod
metadata:
  name: __USER__-__TEMPLATE__
  labels:
    app: session-host
    user: __USER__
    template: __TEMPLATE__
spec:
#  affinity:
#    nodeAffinity:
#      requiredDuringSchedulingIgnoredDuringExecution:
#        nodeSelectorTerms:
#        - matchExpressions:
#          - key: storage/sdf
#            operator: In
#            values:
#            - "true"
#        - matchExpressions:
#          - key: slurm
#            operator: In
#            values: #            - "true"
  restartPolicy: OnFailure
  # use an init container to add relevant entries for passwd and group so that the user at least has their own info
  initContainers:
  - name: passwd
    image: __IMAGE__
    command:
    - bash 
    args:
    - -c
    - cp /etc/passwd /out/passwd && echo '__USER__:x:__UID__:__GID__:__USER__:__HOME__:__SHELL__' >> /out/passwd && echo 'munge:x:16952:1034:munge:/var/lib/munge:/sbin/nologin' >> /out/passwd && echo 'slurm:x:16924:1034:slurm:/var/lib/slurm:/sbin/nologin' >> /out/passwd
    volumeMounts:
    - name: passwd-conf
      mountPath: /out
  containers:
  - name: tmux
    image: __IMAGE__
    imagePullPolicy: Always
    command:
    - /bin/bash
    args:
    - -c
    - sleep infinity
    stdin: True
    tty: True
    resources:
      limits:
        cpu: "0.5"
        memory: "1000Mi"
      requests:
        cpu: "0.1"
        memory: "200Mi"
    securityContext:
      runAsUser: __UID__
      capabilities:
        drop:
        - AUDIT_WRITE
        - DAC_OVERRIDE
        - MKNOD
        - NET_BIND_SERVICE
        - NET_RAW
        - SETGID
        - SETUID
        - SYS_CHROOT

    volumeMounts:
    - name: passwd-conf
      mountPath: /etc/passwd
      readOnly: True
      subPath: passwd
    - name: tmp
      mountPath: /tmp/

    # make use of a statically built tmux that we bind mount in
    - name: slac-apps
      mountPath: /usr/local/bin/
      readOnly: true

    # kipac only ##############
    - name: kipac-data
      mountPath: /sdf/data/kipac/
      readOnly: false
    - name: kipac-group
      mountPath: /sdf/group/kipac/
      readOnly: false
    # #########################

  securityContext:
    fsGroup: __GID__
    supplementalGroups: [ __SUP_GID__ ]

  volumes:
  - name: passwd-conf
    emptyDir: {}

  # this shoudl probably be a pvc or hostpath
  # (should we mount user home directory?)
  - name: tmp
    emptyDir:
      sizeLimit: "1Gi" # need real pv for this to work

  - name: slac-apps
    persistentVolumeClaim:
      claimName: slac-apps

  - name: userpod
    configMap:
      name: userpod

  # kipac only ##############
  - name: kipac-data
    persistentVolumeClaim:
      claimName: kipac-data
  - name: kipac-group
    persistentVolumeClaim:
      claimName: kipac-group
  # #########################


  dnsConfig:
    searches:
    - sdf.slac.stanford.edu
    - slac.stanford.edu


